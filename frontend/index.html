<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VEXUS — Enterprise-grade AI Tutoring Evaluation & Pedagogical Safety Platform." />
  <title>VEXUS — AI Tutoring Evaluation & Safety Platform</title>

  <!-- Google Fonts: Plus Jakarta Sans + Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Marked.js (Markdown parsing) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css?v=2.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" href="favicon.ico" />
</head>
<body>

  <div class="app">
    <!-- ═══════════ SIDEBAR ═══════════ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <!-- Sleek Geometric Vexus Shield / Neural V Logo -->
        <div class="logo-wrapper">
          <svg width="34" height="34" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-icon">
            <defs>
              <linearGradient id="vexusGlow" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                <stop stop-color="#06b6d4" />
                <stop offset="0.5" stop-color="#3b82f6" />
                <stop offset="1" stop-color="#8b5cf6" />
              </linearGradient>
            </defs>
            <path d="M18 2L32 10V26L18 34L4 26V10L18 2Z" stroke="url(#vexusGlow)" stroke-width="2" stroke-linejoin="round"/>
            <path d="M10 12L18 26L26 12" stroke="url(#vexusGlow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 12L18 19L22 12" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="18" cy="12" r="2.2" fill="#06b6d4"/>
          </svg>
        </div>
        <div class="logo-meta">
          <span class="logo-text">Vexus</span>
          <span class="logo-badge" id="portal-role-badge">v2.5 Platform</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Dashboard -->
        <a href="#dashboard" class="nav-item active" id="nav-dashboard" data-page="dashboard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span>Dashboard</span>
        </a>

        <!-- Evaluate -->
        <a href="#evaluate" class="nav-item" id="nav-evaluate" data-page="evaluate">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2"/>
            <path d="M9 12L11 14L15 10"/>
            <line x1="9" y1="6" x2="15" y2="6"/>
          </svg>
          <span>Evaluate</span>
        </a>

        <!-- Students -->
        <a href="#students" class="nav-item" id="nav-students" data-page="students">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="7" r="4"/>
            <path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/>
            <circle cx="19" cy="7" r="3"/>
            <path d="M22 21v-1.5a3 3 0 0 0-3-3h-1"/>
          </svg>
          <span>Students</span>
        </a>

        <!-- Alerts -->
        <a href="#alerts" class="nav-item" id="nav-alerts" data-page="alerts">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span>Alerts</span>
          <span class="nav-badge-pill" id="nav-alerts-badge">Active</span>
        </a>

        <!-- Simulator -->
        <a href="#simulator" class="nav-item" id="nav-simulator" data-page="simulator">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span>AI Simulator</span>
        </a>

        <!-- System Health & Diagnostics -->
        <a href="#health" class="nav-item" id="nav-health" data-page="health">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
          <span>System Health</span>
          <span class="status-indicator-dot online"></span>
        </a>
      </nav>

      <!-- Sidebar Footer Telemetry -->
      <div class="sidebar-footer">
        <div class="sidebar-telemetry-box" onclick="window.location.hash='health'">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <span class="telemetry-label">Model Pipeline</span>
            <span class="badge-success" style="font-size: 10px; padding: 2px 6px;">100% OK</span>
          </div>
          <div class="telemetry-model-name">openai/gpt-oss-20b</div>
          <div class="telemetry-bar">
            <div class="telemetry-bar-fill" style="width: 100%;"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Mobile Backdrop for drawer navigation -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- ═══════════ MAIN CONTENT ═══════════ -->
    <main class="main-content" id="main-content">
      <header class="top-bar" id="top-bar">
        <div class="top-bar-left">
          <!-- Mobile Hamburger Toggle -->
          <button class="mobile-toggle-btn" id="mobile-toggle-btn" aria-label="Toggle navigation menu" title="Open Menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <h1 class="page-title" id="page-title">Executive Dashboard</h1>
        </div>

        <div class="top-bar-actions">
          <!-- Live Status Pill Badge -->
          <div class="top-bar-status-pill" onclick="window.location.hash='health'" title="Click to view live subsystem diagnostics">
            <span class="status-dot-pulse"></span>
            <span class="status-pill-text">Vexus Core • Model: <strong style="color: var(--cyan);">gpt-oss-20b</strong></span>
            <span class="status-pill-tag">ONLINE</span>
          </div>

          <!-- Global Search -->
          <div class="search-box" id="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="global-search" placeholder="Search students, metrics..." />
            <span class="search-kbd-pill">⌘K</span>
          </div>

          <!-- Notification Bell -->
          <button class="notification-btn" id="notification-btn" aria-label="Notifications" title="View safety alerts">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="notification-badge" id="notification-badge">3</span>
          </button>
        </div>
      </header>

      <div id="page-content" class="page-content">
        <!-- Dynamic content injected here -->
      </div>
    </main>
  </div>

  <!-- ═══════════ MODAL OVERLAY ═══════════ -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content" id="modal-content">
      <!-- Dynamic modal content -->
    </div>
  </div>

  <!-- ═══════════ SCRIPTS ═══════════ -->
  <!-- Interactive Neural Canvas Background -->
  <script src="js/canvas-bg.js"></script>

  <!-- Application Logic Modules -->
  <script src="js/api.js?v=2.5"></script>
  <script src="js/auth-modal.js?v=2.5"></script>
  <script src="js/student-portal.js?v=2.5"></script>
  <script src="js/charts.js?v=2.5"></script>
  <script src="js/dashboard.js?v=2.5"></script>
  <script src="js/evaluation.js?v=2.5"></script>
  <script src="js/students.js?v=2.5"></script>
  <script src="js/alerts.js?v=2.5"></script>
  <script src="js/simulator.js?v=2.5"></script>
  <script src="js/health.js?v=2.5"></script>
  <script src="js/app.js?v=2.5"></script>

</body>
</html>
